services:
  concierge:
    build: .
    image: screentostream-concierge:latest
    init: true
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Inside the container the simulator must call the service by its
      # container-local address, not the public tunnel URL.
      INTERNAL_MCP_URL: http://127.0.0.1:8000/mcp
      DATABASE_PATH: /app/runtime/concierge.db
      RUNTIME_DIR: /app/runtime
    volumes:
      # Named volume keeps the non-root container able to write SQLite, frames,
      # and generated art without chowning a host directory.
      - concierge-runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  concierge-runtime:
